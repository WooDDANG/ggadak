# fly.toml app configuration file generated for ggadak on 2026-11-09T01:41:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ggadak'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DATABASE_URL = "file:/data/decisions.sqlite"
  BE_URL = "http://127.0.0.1:3001"
  ANALYSIS_DELIVERY_DIR = "/data/analysis-deliveries"
  GUILD_ACCESS_DELIVERY_DIR = "/data/guild-access"

[[mounts]]
  source = 'ggaddak_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/status'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
