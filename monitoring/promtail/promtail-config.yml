server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ggaddak-ai-metrics
    static_configs:
      - targets:
          - localhost
        labels:
          job: ggaddak-ai
          app: backend
          __path__: /var/log/be/ai-metrics.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            stage: stage
            model: model
            provider: provider
            durationMs: durationMs
            inputTokens: inputTokens
            outputTokens: outputTokens
            success: success
            error: error
      - labels:
          stage:
          model:
          provider:
          success:
