server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ggaddak-ai-metrics
    static_configs:
      - targets:
          - localhost
        labels:
          job: ggaddak-ai
          app: backend
          __path__: /var/log/be/ai-metrics.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            stage: stage
            provider: provider
            success: success
      - labels:
          stage:
          provider:
          success:
  - job_name: ggaddak-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: ggaddak-app
          app: backend
          __path__: /var/log/be/be.log
    pipeline_stages:
      - multiline:
          firstline: '^(\{|\[\d{4}-\d{2}-\d{2} )'
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - regex:
          expression: '^\[(?P<time>[^]]+)\] \[(?P<level>[^]]+)\] \[(?P<service>[^]]+)\]: (?P<message>.*)'
      - timestamp:
          source: time
          format: '2006-01-02 15:04:05'
          location: Asia/Seoul
      - labels:
          level:
          service:
  - job_name: ggaddak-bot
    static_configs:
      - targets: [localhost]
        labels:
          job: ggaddak-app
          app: bot
          __path__: /var/log/bot/bot.log
    pipeline_stages:
      - multiline:
          firstline: '^(\{|\[\d{4}-\d{2}-\d{2} )'
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - regex:
          expression: '^\[(?P<time>[^]]+)\] \[(?P<level>[^]]+)\] \[(?P<service>[^]]+)\]: (?P<message>.*)'
      - timestamp:
          source: time
          format: '2006-01-02 15:04:05'
          location: Asia/Seoul
      - labels:
          level:
          service:
