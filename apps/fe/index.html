<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGADDAK — 팀 의사결정 타임라인</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: #232f4a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
      --chat-bg: #0d1322;
      --chat-border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 24px;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 20px;
    }

    .title-group h1 {
      font-size: 1.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .filter-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .btn-refresh {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh:hover {
      background: var(--accent-hover);
    }

    .timeline {
      position: relative;
      margin-left: 20px;
      padding-left: 28px;
      border-left: 2px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .timeline-node {
      position: relative;
    }

    .timeline-dot {
      position: absolute;
      left: -37px;
      top: 18px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
    }

    .timeline-dot.superseded {
      background: var(--red);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      border-color: #3b82f6;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-topic {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-decided { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
    .badge-superseded { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }

    .card-decision {
      font-size: 1rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .card-rationale {
      background: #0f1524;
      border-left: 3px solid var(--purple);
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-bottom: 14px;
    }

    .action-items-list {
      margin-top: 10px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #94a3b8;
      background: #182239;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Expandable Transcript Accordion */
    .transcript-accordion {
      background: var(--chat-bg);
      border: 1px solid var(--chat-border);
      border-radius: 8px;
      margin-top: 12px;
      overflow: hidden;
    }

    .transcript-summary {
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .transcript-summary:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    .transcript-body {
      padding: 12px 14px;
      border-top: 1px solid var(--chat-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    .chat-bubble {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: #141c2e;
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 2px solid #3b82f6;
    }

    .chat-bubble-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }

    .chat-author {
      font-weight: 700;
      color: #38bdf8;
    }

    .chat-reply-tag {
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .chat-time {
      margin-left: auto;
      color: #64748b;
      font-size: 0.7rem;
    }

    .chat-text {
      font-size: 0.84rem;
      color: #e2e8f0;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .discord-link {
      color: #818cf8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .discord-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>⚡ GGADDAK 의사결정 타임라인</h1>
      <p>디스코드 서버에서 실시간 수집 및 추출된 조직 의사결정 기록</p>
    </div>
    <button id="btn-refresh" class="btn-refresh">🔄 새로고침</button>
  </header>

  <div class="controls">
    <input type="text" id="search-input" class="search-input" placeholder="안건, 결정 내용, 근거 또는 대화 원문 검색...">
    <select id="state-filter" class="filter-select">
      <option value="">모든 상태 (전체)</option>
      <option value="Decided">확정됨 (Decided)</option>
      <option value="Superseded">대체됨 (Superseded)</option>
    </select>
  </div>

  <div id="timeline" class="timeline"></div>
</div>

<script>
  const API_URL = 'http://localhost:3001/api/decisions';
  let allDecisions = [];

  async function fetchDecisions() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('API 응답 실패');
      const data = await res.json();
      allDecisions = data.decisions || [];
      renderTimeline();
    } catch (err) {
      console.warn('Backend API connection failed, rendering sample or empty:', err);
      if (allDecisions.length === 0) {
        renderTimeline();
      }
    }
  }

  function renderTimeline() {
    const timelineEl = document.getElementById('timeline');
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    const stateFilter = document.getElementById('state-filter').value;

    const filtered = allDecisions.filter(d => {
      const matchesSearch = 
        d.topic.toLowerCase().includes(query) ||
        d.decision.toLowerCase().includes(query) ||
        d.rationale.toLowerCase().includes(query) ||
        (d.rawTranscript && d.rawTranscript.toLowerCase().includes(query));
      const matchesState = !stateFilter || d.state === stateFilter;
      return matchesSearch && matchesState;
    });

    if (filtered.length === 0) {
      timelineEl.innerHTML = `
        <div class="empty-state">
          <h3>기록된 의사결정이 없습니다</h3>
          <p style="margin-top: 6px;">디스코드 채널에서 토론 후 📌 이모지를 달아보세요.</p>
        </div>
      `;
      return;
    }

    timelineEl.innerHTML = filtered.map(d => {
      const isSuperseded = d.state === 'Superseded';
      const badgeClass = isSuperseded ? 'badge-superseded' : 'badge-decided';
      const dotClass = isSuperseded ? 'superseded' : '';
      const dateStr = new Date(d.createdAt).toLocaleString('ko-KR');

      const actionItemsHtml = d.actionItems && d.actionItems.length > 0 ? `
        <div class="action-items-list">
          ${d.actionItems.map(item => `
            <div class="action-item">
              <span>☑️ ${item.task}</span>
              ${item.assignee ? `<span style="color: #38bdf8;">(@${item.assignee})</span>` : ''}
            </div>
          `).join('')}
        </div>
      ` : '';

      // Render raw messages or plain transcript
      const rawMessages = d.source?.rawMessages || [];
      let transcriptHtml = '';

      if (rawMessages.length > 0) {
        transcriptHtml = `
          <details class="transcript-accordion">
            <summary class="transcript-summary">
              <span>💬 대화 원문 보기 (${rawMessages.length}개 메시지)</span>
              <span>▼</span>
            </summary>
            <div class="transcript-body">
              ${rawMessages.map(m => `
                <div class="chat-bubble">
                  <div class="chat-bubble-header">
                    <span class="chat-author">${m.author}</span>
                    ${m.replyingTo ? `<span class="chat-reply-tag">↪ @${m.replyingTo}에게 답장</span>` : ''}
                    <span class="chat-time">${m.createdAt ? new Date(m.createdAt).toLocaleTimeString('ko-KR') : ''}</span>
                  </div>
                  <div class="chat-text">${m.content}</div>
                </div>
              `).join('')}
            </div>
          </details>
        `;
      } else if (d.rawTranscript) {
        transcriptHtml = `
          <details class="transcript-accordion">
            <summary class="transcript-summary">
              <span>💬 대화 원문 보기</span>
              <span>▼</span>
            </summary>
            <div class="transcript-body" style="white-space: pre-wrap; font-family: monospace; font-size: 0.8rem;">
              ${d.rawTranscript}
            </div>
          </details>
        `;
      }

      return `
        <div class="timeline-node">
          <div class="timeline-dot ${dotClass}"></div>
          <div class="card">
            <div class="card-header">
              <div class="card-topic">
                <span>[${d.topic}]</span>
                <span class="badge ${badgeClass}">${d.state}${d.supersedesId ? ` (← ${d.supersedesId})` : ''}</span>
              </div>
              <span style="font-size: 0.75rem; color: var(--text-muted);">${d.id}</span>
            </div>

            <div class="card-decision">🎯 ${d.decision}</div>
            
            <div class="card-rationale">
              <strong>💡 결정 근거:</strong> ${d.rationale}
            </div>

            ${actionItemsHtml}
            ${transcriptHtml}

            <div class="card-footer">
              <span>📅 ${dateStr} ${d.source.channelName ? `· #${d.source.channelName}` : ''}</span>
              ${d.source.messageUrl ? `<a href="${d.source.messageUrl}" target="_blank" class="discord-link">💬 디스코드 스레드로 바로가기 ➔</a>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('btn-refresh').addEventListener('click', fetchDecisions);
  document.getElementById('search-input').addEventListener('input', renderTimeline);
  document.getElementById('state-filter').addEventListener('change', renderTimeline);

  fetchDecisions();
</script>

</body>
</html>
